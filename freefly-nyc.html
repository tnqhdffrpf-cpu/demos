<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>NYC Free Flight — Golden Hour</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#1a0a0e; }
canvas { display:block; }
#vignette {
  position:fixed; inset:0; pointer-events:none; z-index:3;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
}
#overlay {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.78); color:#fff; text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  z-index:10; padding:20px;
}
#overlay h1 {
  font-size:clamp(1.4rem,5vw,2.4rem); margin-bottom:8px; font-weight:700;
  background:linear-gradient(135deg,#ffcc66,#ff6622);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
#overlay .sub { font-size:clamp(0.7rem,2vw,0.85rem); opacity:0.55; margin-bottom:6px; letter-spacing:0.12em; text-transform:uppercase; }
#overlay p  { font-size:clamp(0.85rem,3vw,1.05rem); opacity:0.82; margin-bottom:24px; max-width:340px; line-height:1.6; }
#startBtn {
  padding:14px 40px; font-size:1.1rem; border:none; border-radius:50px;
  background:linear-gradient(135deg,#ff9933,#ff4411); color:#fff;
  cursor:pointer; font-weight:700; letter-spacing:0.04em;
  box-shadow:0 4px 28px rgba(255,120,30,0.55);
}
#startBtn:active { transform:scale(0.96); }
#region-label {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  color:rgba(255,240,220,0.92); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:clamp(0.7rem,2.2vw,0.85rem); pointer-events:none;
  text-shadow:0 1px 4px rgba(0,0,0,0.9); z-index:5; white-space:nowrap;
  background:rgba(0,0,0,0.38); padding:5px 16px; border-radius:20px;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
#touch-left, #touch-right {
  position:fixed; top:0; bottom:0; width:50%; opacity:0; z-index:4; transition:opacity 0.1s;
}
#touch-left  { left:0;  background:radial-gradient(ellipse at 20% 50%,rgba(255,160,60,0.12),transparent 70%); }
#touch-right { right:0; background:radial-gradient(ellipse at 80% 50%,rgba(255,160,60,0.12),transparent 70%); }
#touch-left.active, #touch-right.active { opacity:1; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="overlay">
  <div class="sub">Manhattan · Golden Hour</div>
  <h1>NYC Free Flight</h1>
  <p>Fly your biplane over Manhattan at golden hour. Tilt to turn &amp; pitch — tap left/right to steer with touch.</p>
  <button id="startBtn">Start Flying</button>
</div>
<div id="region-label">Flying over Central Park</div>
<div id="touch-left"></div>
<div id="touch-right"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const CFG = {
  worldSize:6000, planeSpeed:110, turnGain:2.0, inputSmooth:0.06,
  bankMult:1.05, bankSmooth:0.13, cameraSmooth:0.068, lookSmooth:0.10,
  camDist:26, camHeight:9, targetAlt:180, altSmooth:0.010,
  tiltClamp:45, pitchClamp:30, pitchGain:60, pitchSmooth:0.07,
};

function rng(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 1, 16000);
const scene  = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xffbb88, 0.000125);

// ── Sky Shader ────────────────────────────────────────────────────────────────
const SUN_DIR = new THREE.Vector3(-0.38, 0.17, -0.91).normalize();

(function buildSky() {
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:     { value: new THREE.Color(0x06103a) },
      midColor:     { value: new THREE.Color(0xdd5522) },
      horizonColor: { value: new THREE.Color(0xffaa44) },
      sunDir:       { value: SUN_DIR },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 topColor, midColor, horizonColor, sunDir;
      varying vec3 vWorldPos;
      void main() {
        vec3 dir = normalize(vWorldPos);
        float h = clamp(dir.y, -0.1, 1.0);
        float tMid = clamp(h * 4.0, 0.0, 1.0);
        float tTop = clamp(h * 2.0, 0.0, 1.0);
        vec3 sky = mix(horizonColor, midColor, tMid);
        sky = mix(sky, topColor, tTop * tTop);
        // Below horizon warm glow
        if (dir.y < 0.0) sky = mix(sky, vec3(0.8,0.3,0.05), clamp(-dir.y*3.0,0.0,1.0));
        // Sun disc
        float sun = max(0.0, dot(dir, sunDir));
        sky += vec3(1.2, 0.7, 0.25) * pow(sun, 220.0) * 4.0;
        // Coronas
        sky += vec3(1.0, 0.5, 0.15) * pow(sun, 16.0) * 0.5;
        sky += vec3(0.8, 0.3, 0.08) * pow(sun, 5.0) * 0.18;
        gl_FragColor = vec4(sky, 1.0);
      }`,
    side: THREE.BackSide,
    depthWrite: false,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(13000, 32, 16), skyMat));
})();

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xff9944, 0x2244aa, 0.55));

const sunLight = new THREE.DirectionalLight(0xffcc66, 2.4);
sunLight.position.set(-1400, 600, -2800);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 10;
sunLight.shadow.camera.far  = 5000;
sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = -2000;
sunLight.shadow.camera.right = sunLight.shadow.camera.top   =  2000;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

scene.add(Object.assign(new THREE.DirectionalLight(0x4488cc, 0.35), {
  position: new THREE.Vector3(900, 700, 1200)
}));

// City ambient glow near ground
const glowA = new THREE.PointLight(0xff7722, 1.2, 2800);
glowA.position.set(-200, 0, -1200); scene.add(glowA);
const glowB = new THREE.PointLight(0xff6600, 0.8, 2400);
glowB.position.set(300, 0, -2000); scene.add(glowB);

// ── Window Textures ───────────────────────────────────────────────────────────
const WIN_TEX = [];
(function makeWindowTextures() {
  const r = rng(9999);
  [0.28, 0.48, 0.65, 0.82, 0.94].forEach((lit, idx) => {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 256;
    const ctx = c.getContext('2d');
    const walls = ['#252d38','#2e3230','#241e1e','#32281a','#1e2822'];
    ctx.fillStyle = walls[idx]; ctx.fillRect(0,0,128,256);
    const cols=6, rows=14, cw=Math.floor(128/cols), rh=Math.floor(256/rows);
    for (let row=0;row<rows;row++) for (let col=0;col<cols;col++) {
      if (r() < lit) {
        const br = 0.75+r()*0.25, warm = r()>0.25;
        const R = warm ? Math.floor(230*br) : Math.floor(160*br);
        const G = Math.floor(205*br);
        const B = warm ? Math.floor(110*br) : Math.floor(235*br);
        ctx.fillStyle = `rgb(${R},${G},${B})`;
      } else {
        ctx.fillStyle = 'rgba(0,4,12,0.97)';
      }
      ctx.fillRect(col*cw+1, row*rh+1, cw-2, rh-2);
    }
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    WIN_TEX.push(t);
  });
})();

// ── Material helpers ──────────────────────────────────────────────────────────
const rM = rng(31337);
function glassMat(col) {
  return new THREE.MeshStandardMaterial({
    color: col, metalness: 0.82, roughness: 0.08,
    emissive: new THREE.Color(col).multiplyScalar(0.06),
  });
}
function concreteMat(col) {
  return new THREE.MeshStandardMaterial({
    color: col, metalness: 0.0, roughness: 0.88,
    map: WIN_TEX[Math.floor(rM()*WIN_TEX.length)],
  });
}
function brickMat(col) {
  return new THREE.MeshStandardMaterial({
    color: col, metalness: 0.0, roughness: 0.96,
    map: WIN_TEX[Math.floor(rM()*WIN_TEX.length)],
  });
}

// ── Terrain ───────────────────────────────────────────────────────────────────
const PARK_W1=-400, PARK_W2=400, PARK_S=-2000, PARK_N=2000;

function getHeight(x, z) {
  const cx = Math.max(0, Math.abs(x)-900), cz = Math.max(0, Math.abs(z)-2300);
  const blend = Math.min(1, Math.sqrt(cx*cx+cz*cz)/500);
  if (blend < 0.001) return 0;
  return (Math.sin(x/280)*Math.sin(z/350)*30 + Math.sin(x/140+1.2)*12 + Math.sin(z/190+0.7)*10)*blend;
}

(function buildTerrain() {
  // Street-grid canvas texture
  const gc = document.createElement('canvas'); gc.width=gc.height=512;
  const gx = gc.getContext('2d');
  gx.fillStyle='#3a3630'; gx.fillRect(0,0,512,512);
  // Block fills
  gx.fillStyle='#343028';
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) gx.fillRect(c*64+3,r*64+3,58,58);
  // Street lines
  gx.strokeStyle='#50493e'; gx.lineWidth=2;
  for (let i=0;i<=8;i++) {
    gx.beginPath(); gx.moveTo(i*64,0); gx.lineTo(i*64,512); gx.stroke();
    gx.beginPath(); gx.moveTo(0,i*64); gx.lineTo(512,i*64); gx.stroke();
  }
  // Yellow center-line dashes
  gx.strokeStyle='rgba(200,165,30,0.5)'; gx.lineWidth=1; gx.setLineDash([8,8]);
  for (let i=0;i<=8;i++) {
    gx.beginPath(); gx.moveTo(i*64,0); gx.lineTo(i*64,512); gx.stroke();
  }
  const gt = new THREE.CanvasTexture(gc);
  gt.wrapS=gt.wrapT=THREE.RepeatWrapping; gt.repeat.set(28,28);
  gt.encoding = THREE.sRGBEncoding;

  const urban = new THREE.Mesh(
    new THREE.PlaneGeometry(CFG.worldSize, CFG.worldSize),
    new THREE.MeshLambertMaterial({ color:0x3a3630, map:gt })
  );
  urban.rotation.x=-Math.PI/2; urban.position.y=-0.1; urban.receiveShadow=true;
  scene.add(urban);

  // Outer grass (golden-autumn tint)
  const outerGrass = new THREE.Mesh(
    new THREE.PlaneGeometry(CFG.worldSize+400, CFG.worldSize+400),
    new THREE.MeshLambertMaterial({ color:0x4a5e30 })
  );
  outerGrass.rotation.x=-Math.PI/2; outerGrass.position.y=-0.2;
  scene.add(outerGrass);

  // Central Park
  const park = new THREE.Mesh(
    new THREE.PlaneGeometry(800,4000),
    new THREE.MeshLambertMaterial({ color:0x2a5e1a })
  );
  park.rotation.x=-Math.PI/2; park.receiveShadow=true; scene.add(park);

  [[0,-800,360,620],[- 100,500,210,410],[120,-200,190,310]].forEach(([px,pz,pw,pd])=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(pw,pd),
      new THREE.MeshLambertMaterial({color:0x3e7a2a}));
    m.rotation.x=-Math.PI/2; m.position.set(px,0.1,pz); scene.add(m);
  });

  // Reservoir
  const res = new THREE.Mesh(new THREE.PlaneGeometry(370,440),
    new THREE.MeshStandardMaterial({color:0x0e3a70,metalness:0.4,roughness:0.05,transparent:true,opacity:0.94}));
  res.rotation.x=-Math.PI/2; res.position.set(0,0.6,665); scene.add(res);

  // Bethesda fountain area
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(30,16),
    new THREE.MeshLambertMaterial({color:0xc8b888}));
  plaza.rotation.x=-Math.PI/2; plaza.position.set(0,0.3,200); scene.add(plaza);
  const fountain = new THREE.Mesh(new THREE.CylinderGeometry(8,10,3,16),
    new THREE.MeshStandardMaterial({color:0xc0b080,roughness:0.7,metalness:0.2}));
  fountain.position.set(0,1.5,200); scene.add(fountain);
  const fPool = new THREE.Mesh(new THREE.CylinderGeometry(6,6,0.5,16),
    new THREE.MeshStandardMaterial({color:0x1a4a70,roughness:0.1,metalness:0.3,transparent:true,opacity:0.9}));
  fPool.position.set(0,0.5,200); scene.add(fPool);
})();

// ── Outskirts (hills & lakes) ─────────────────────────────────────────────────
(function buildOutskirts() {
  const rH = rng(77777);
  const hillMat1 = new THREE.MeshLambertMaterial({color:0x4a7a2a});
  const hillMat2 = new THREE.MeshLambertMaterial({color:0x5e8a38});
  const hillGeo  = new THREE.SphereGeometry(1,8,5);
  [[-1400,1200,260,90,240],[-1600,-800,300,80,260],[-1800,2600,350,100,300],
   [-1200,-2600,280,80,250],[1500,1000,320,90,280],[1700,-1200,290,85,260],
   [1300,2800,310,95,290],[1600,-2800,270,80,240],[-2000,0,380,110,320],
   [2100,400,360,105,310],[-1500,2800,290,85,260],[1400,-2800,310,90,275],
   [-2200,-1600,340,100,300],[2300,1800,320,95,285],[-2400,1000,370,108,325]
  ].forEach(([x,z,rx,ry,rz])=>{
    const h = new THREE.Mesh(hillGeo, rH()>0.5?hillMat1:hillMat2);
    h.position.set(x+(rH()-0.5)*80, ry*0.18, z+(rH()-0.5)*80);
    h.scale.set(rx,ry,rz); h.receiveShadow=true; scene.add(h);
  });
  const lakeMat = new THREE.MeshLambertMaterial({color:0x1a3d6a,transparent:true,opacity:0.85});
  [[-1500,-1800,420,310],[1600,2200,380,280],[-1800,2400,340,260],
   [1300,-2600,450,320],[-2100,-200,300,220],[2000,800,280,200]
  ].forEach(([x,z,w,d])=>{
    const lake = new THREE.Mesh(new THREE.PlaneGeometry(w,d), lakeMat);
    lake.rotation.x=-Math.PI/2; lake.position.set(x, getHeight(x,z)+0.5, z); scene.add(lake);
  });
})();

// ── Rivers (animated water shaders) ──────────────────────────────────────────
const waterUniforms = [];
(function buildRivers() {
  const vert = `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
  const frag = `
    uniform float time; uniform vec3 baseColor;
    varying vec2 vUv;
    void main(){
      vec2 uv=vUv;
      float w=sin(uv.x*9.0+time*1.3)*sin(uv.y*5.0+time*0.9)*0.05
             +sin(uv.x*18.0-time*2.2+uv.y*7.0)*0.022
             +sin((uv.x+uv.y)*13.0+time*1.9)*0.012;
      vec3 col=baseColor+vec3(w*0.6,w*0.7,w*0.5);
      // Sun glint streaks
      float g=pow(max(0.0,sin(uv.x*50.0+time*4.0)*0.5+0.5),8.0)*0.25;
      col+=vec3(1.0,0.8,0.4)*g*(1.0-abs(uv.y-0.5)*2.2);
      // Edge ripples
      float edge=1.0-abs(uv.x-0.5)*2.0;
      col=mix(col*0.6,col,clamp(edge*3.0,0.0,1.0));
      gl_FragColor=vec4(col,0.86);
    }`;
  [{x:-1060,w:300,col:new THREE.Color(0x0a2850)},  // Hudson
   {x: 1120,w:240,col:new THREE.Color(0x0a2850)},  // East River
  ].forEach(({x,w,col})=>{
    const u = {time:{value:0}, baseColor:{value:col}};
    waterUniforms.push(u);
    const mat = new THREE.ShaderMaterial({uniforms:u,vertexShader:vert,fragmentShader:frag,
      transparent:true,depthWrite:false});
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,CFG.worldSize,1,1), mat);
    mesh.rotation.x=-Math.PI/2; mesh.position.set(x,0.3,0); scene.add(mesh);
  });
})();

// ── Buildings ─────────────────────────────────────────────────────────────────
// [x, z, w, d, h, color, type] type: 0=glass, 1=concrete, 2=brick
const BUILDINGS = [
  [-460,-370,62,58,37,0x6e7e7e,2],[-465,-180,68,60,80,0x8a7060,2],
  [-462,-290,36,36,99,0x5a7888,0],[-462,-248,36,36,103,0x6a8898,0],
  [-470,310,40,40,106,0x6a8078,1],[-470,355,40,40,106,0x6a8078,1],
  [-468,-395,90,45,101,0x6e7068,2],[-490,-1620,90,55,120,0x706860,2],
  [-500,-1760,48,48,213,0x7088a0,0],[-520,-1900,42,42,178,0x88a0b0,0],
  [510,-2050,82,68,77,0xa09870,1],[80,-2090,110,48,70,0x808080,1],
  [-240,-2080,42,38,128,0x6a7880,0],[-310,-2080,38,34,86,0x786e70,2],
  [-165,-2080,36,34,90,0x7a8090,0],
  [540,70,130,55,28,0xa89868,2],[465,180,28,28,46,0x908070,2],
  [462,305,30,30,62,0x908878,2],[458,-625,28,28,65,0x887868,2],
  [458,-580,30,30,68,0x887868,2],[460,-70,30,30,55,0x908070,2],
  // Supertalls
  [920,-1900,28,28,426,0xb0bcc8,0],[320,-2080,24,24,436,0xbcccd8,0],
  [160,-2080,42,42,306,0xa0aab8,0],[50,-2080,38,38,290,0xa8b2c0,0],
  [480,-2100,45,45,209,0x7888a0,0],[340,-2090,40,40,162,0x7090a0,0],
  [-460,-1960,52,52,229,0x7888b0,0],[-408,-1960,52,52,229,0x7888b0,0],
  // UWS
  [-540,-800,40,38,55,0x887060,2],[-540,-700,38,38,60,0x887060,2],
  [-540,-600,40,40,54,0x887060,2],[-540,-500,38,38,62,0x887060,2],
  [-540,-100,40,40,56,0x887060,2],[-540,100,38,38,58,0x887060,2],
  [-540,500,40,38,52,0x887060,2],[-540,700,38,38,56,0x887060,2],
  [-540,900,40,40,54,0x887060,2],[-540,1100,38,38,50,0x887060,2],
  [-540,1300,40,38,48,0x887060,2],
  // UES
  [540,-800,38,38,60,0x7a8870,2],[540,-600,40,40,57,0x7a8870,2],
  [540,-400,38,38,62,0x7a8870,2],[540,-200,40,40,56,0x7a8870,2],
  [540,0,38,38,58,0x7a8870,2],[540,200,40,38,54,0x7a8870,2],
  [540,400,38,38,60,0x7a8870,2],[540,600,40,40,57,0x7a8870,2],
  [540,800,38,38,52,0x7a8870,2],[540,1000,40,40,54,0x7a8870,2],
  [540,1200,38,38,50,0x7a8870,2],[540,1400,40,38,52,0x7a8870,2],
  // Harlem
  [-300,2200,45,38,38,0x88807a,2],[-150,2200,40,38,42,0x88807a,2],
  [0,2200,45,40,38,0x88807a,2],[150,2200,40,38,40,0x88807a,2],
  [300,2200,45,40,44,0x88807a,2],[-300,2400,42,38,36,0x88807a,2],
  [0,2400,45,40,40,0x88807a,2],[300,2400,40,38,38,0x88807a,2],
  // Midtown east
  [700,-2200,45,40,190,0x7888a0,0],[800,-2200,42,42,225,0x6878a0,0],
  [900,-2200,45,42,178,0x7888a0,0],[1000,-2200,42,40,205,0x6878a0,0],
  [1100,-2200,45,42,188,0x7888a0,0],[650,-2350,42,42,162,0x7888a0,0],
  [750,-2350,45,40,185,0x6878a0,0],[850,-2350,42,42,198,0x7888a0,0],
  [950,-2350,45,40,172,0x6878a0,0],[1050,-2350,42,42,168,0x7888a0,0],
  [600,-2500,45,40,152,0x7888a0,0],[700,-2500,42,42,178,0x6878a0,0],
  [800,-2500,45,40,205,0x7888a0,0],[900,-2500,42,42,168,0x6878a0,0],
  [1000,-2500,45,40,188,0x7888a0,0],
  // Midtown west
  [-100,-2200,42,40,158,0x7888a0,0],[-200,-2200,45,42,174,0x6878a0,0],
  [-350,-2200,42,40,148,0x7888a0,0],[-100,-2350,45,42,164,0x7888a0,0],
  [-200,-2350,42,40,178,0x6878a0,0],[-350,-2350,45,42,144,0x7888a0,0],
  [-100,-2500,42,40,168,0x7888a0,0],[-200,-2500,45,42,185,0x6878a0,0],

const rooftopSlots = []; // [x,z,h,w,d] for water tower placement

(function buildNYC() {
  const boxGeo = new THREE.BoxGeometry(1,1,1);
  const rB = rng(22222);

  BUILDINGS.forEach(([bx,bz,bw,bd,bh,col,type])=>{
    const mat = type===0 ? glassMat(col) : type===1 ? concreteMat(col) : brickMat(col);
    const mesh = new THREE.Mesh(boxGeo, mat);
    mesh.position.set(bx, bh*0.5, bz);
    mesh.scale.set(bw, bh, bd);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);

    // Setback cap
    const capH = Math.max(2, bh*0.04);
    const cap = new THREE.Mesh(
      new THREE.BoxGeometry(bw*0.86, capH, bd*0.86),
      new THREE.MeshStandardMaterial({color:new THREE.Color(col).multiplyScalar(0.6),roughness:0.9,metalness:0.1})
    );
    cap.position.set(bx, bh+capH*0.5, bz); cap.castShadow=true; scene.add(cap);

    // Antenna spire on tall buildings
    if (bh > 140 && rB() > 0.38) {
      const sh = 18+rB()*90;
      const spire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25,1.0,sh,6),
        new THREE.MeshStandardMaterial({color:0x9098a8,metalness:0.9,roughness:0.15})
      );
      spire.position.set(bx+(rB()-0.5)*bw*0.2, bh+capH+sh*0.5, bz+(rB()-0.5)*bd*0.2);
      scene.add(spire);
      // Red beacon
      const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.7,6,4),
        new THREE.MeshStandardMaterial({color:0xff1111,emissive:new THREE.Color(0xff0000),emissiveIntensity:2}));
      beacon.position.set(bx+(rB()-0.5)*bw*0.2, bh+capH+sh, bz+(rB()-0.5)*bd*0.2);
      scene.add(beacon);
    }

    // Emissive billboard on some mid-rise faces
    if (bh > 40 && bh < 120 && rB() > 0.78) {
      const bCanvas = document.createElement('canvas');
      bCanvas.width=128; bCanvas.height=64;
      const bCtx = bCanvas.getContext('2d');
      const colors = ['#ff4400','#0088ff','#ffcc00','#00cc44','#ff0088'];
      bCtx.fillStyle=colors[Math.floor(rB()*colors.length)];
      bCtx.fillRect(0,0,128,64);
      bCtx.fillStyle='rgba(0,0,0,0.3)'; bCtx.fillRect(4,4,120,56);
      bCtx.fillStyle='#fff'; bCtx.font='bold 18px sans-serif';
      bCtx.fillText('NYC',10,40);
      const bTex = new THREE.CanvasTexture(bCanvas);
      const bill = new THREE.Mesh(
        new THREE.PlaneGeometry(bw*0.6, bh*0.15),
        new THREE.MeshStandardMaterial({map:bTex,emissive:new THREE.Color(0xffffff),emissiveMap:bTex,emissiveIntensity:0.6,side:THREE.DoubleSide})
      );
      bill.position.set(bx, bh*0.75, bz+bd*0.51);
      scene.add(bill);
    }

    // Mark for water towers
    if (bh > 25 && bh < 90 && rB() > 0.52) {
      rooftopSlots.push([bx,bz,bh,bw,bd]);
    }
  });

  // Dense fill buildings (instanced, with window texture)
  const bgMat = new THREE.MeshStandardMaterial({
    color:0x606870, roughness:0.82, metalness:0.18, map:WIN_TEX[2]
  });
  const bgInst = new THREE.InstancedMesh(boxGeo, bgMat, 600);
  bgInst.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  const dummy = new THREE.Object3D();
  const rand = rng(12345);
  let idx=0;

  for (let row=-24; row<=24 && idx<200; row++) {
    for (let col2=0; col2<3 && idx<200; col2++) {
      const x=-660-col2*85-rand()*20, z=row*160+rand()*40;
      if (Math.abs(z)>2650) continue;
      const w=28+rand()*28, d=26+rand()*24, h=18+Math.pow(rand(),1.5)*90;
      dummy.position.set(x,h*0.5,z); dummy.scale.set(w,h,d);
      dummy.rotation.y=(rand()-0.5)*0.18; dummy.updateMatrix();
      bgInst.setMatrixAt(idx++, dummy.matrix);
    }
  }
  for (let row=-24; row<=24 && idx<400; row++) {
    for (let col2=0; col2<3 && idx<400; col2++) {
      const x=660+col2*90+rand()*20, z=row*160+rand()*40;
      if (Math.abs(z)>2650) continue;
      const w=28+rand()*28, d=26+rand()*24, h=18+Math.pow(rand(),1.5)*95;
      dummy.position.set(x,h*0.5,z); dummy.scale.set(w,h,d);
      dummy.rotation.y=(rand()-0.5)*0.18; dummy.updateMatrix();
      bgInst.setMatrixAt(idx++, dummy.matrix);
    }
  }
  // Downtown lower Manhattan cluster
  for (let i=0; i<80 && idx<480; i++) {
    const x=-300+rand()*600, z=-2600-rand()*800;
    const w=22+rand()*35, d=22+rand()*30, h=40+rand()*220;
    dummy.position.set(x,h*0.5,z); dummy.scale.set(w,h,d);
    dummy.rotation.y=(rand()-0.5)*0.25; dummy.updateMatrix();
    bgInst.setMatrixAt(idx++, dummy.matrix);
  }
  bgInst.count=idx; bgInst.instanceMatrix.needsUpdate=true;
  bgInst.castShadow=true;
  scene.add(bgInst);
})();

// ── Bridges ───────────────────────────────────────────────────────────────────
(function buildBridges() {
  const steelMat=new THREE.MeshStandardMaterial({color:0x787080,metalness:0.85,roughness:0.25});
  const cableMat=new THREE.MeshLambertMaterial({color:0x605858});
  const concMat =new THREE.MeshLambertMaterial({color:0x908060});
  const stoneMat=new THREE.MeshLambertMaterial({color:0x806040});

  function bridge(x1,x2,bz,deckH,isVertical) {
    const len=x2-x1, cx=(x1+x2)*0.5;
    // Deck
    const deckW=isVertical?len:len, deckD=isVertical?20:20;
    const deck=new THREE.Mesh(new THREE.BoxGeometry(deckW,3,deckD),concMat);
    deck.position.set(cx,deckH,bz); deck.castShadow=true; scene.add(deck);
    // Road lines on deck
    const line=new THREE.Mesh(new THREE.BoxGeometry(deckW,0.2,1),
      new THREE.MeshLambertMaterial({color:0xf0e040}));
    line.position.set(cx,deckH+1.6,bz); scene.add(line);
    // Twin towers
    [0.28,0.72].forEach(t=>{
      const tx=x1+len*t;
      const tower=new THREE.Mesh(new THREE.BoxGeometry(7,82,7),stoneMat);
      tower.position.set(tx,deckH+41,bz); tower.castShadow=true; scene.add(tower);
      // Gothic arch suggestion
      const arch=new THREE.Mesh(new THREE.BoxGeometry(7,4,14),stoneMat);
      arch.position.set(tx,deckH+52,bz); scene.add(arch);
      // Tower peak
      const peak=new THREE.Mesh(new THREE.ConeGeometry(4,8,4),stoneMat);
      peak.position.set(tx,deckH+82+4,bz); scene.add(peak);
    });
    // Main suspension cables (twin)
    [-4,4].forEach(cOff=>{
      const cable=new THREE.Mesh(new THREE.BoxGeometry(len,1.5,1),cableMat);
      cable.position.set(cx,deckH+78,bz+cOff); scene.add(cable);
      // Drooping hint: mid-cable sag
      const sag=new THREE.Mesh(new THREE.BoxGeometry(len*0.4,1,1),cableMat);
      sag.position.set(cx,deckH+55,bz+cOff); scene.add(sag);
    });
    // Vertical hangers
    const hGeo=new THREE.BoxGeometry(1,30,1);
    for (let i=1;i<=6;i++) {
      const hx=x1+len*(i/7);
      const h=new THREE.Mesh(hGeo,cableMat);
      h.position.set(hx,deckH+30,bz); scene.add(h);
    }
  }

  bridge(820, 1400, -2870, 16);    // Brooklyn Bridge (east)
  bridge(-960,-1280,1820, 20);     // George Washington Bridge (west)
})();

function buildBiplane() {
  const root=new THREE.Group();
  const M={
    body: new THREE.MeshLambertMaterial({color:0xf0a818}),
    wing: new THREE.MeshLambertMaterial({color:0xd08810}),
    red:  new THREE.MeshLambertMaterial({color:0xcc2230}),

    white:new THREE.MeshLambertMaterial({color:0xfafafa}),
  };
  function part(geo,mat,px=0,py=0,pz=0,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){
    const m=new THREE.Mesh(geo,mat);
    m.position.set(px,py,pz); m.rotation.set(rx,ry,rz); m.scale.set(sx,sy,sz);
    root.add(m); return m;
  }
  part(new THREE.BoxGeometry(2.0,1.7,8.5),M.body);
  part(new THREE.CylinderGeometry(0.38,0.95,2.4,8),M.body,0,0,-5.2,Math.PI/2);
  part(new THREE.BoxGeometry(1.2,1.05,2.8),M.body,0,-0.15,3.8);
  part(new THREE.BoxGeometry(16,0.28,2.5),M.wing,0,1.9,-0.5);
  part(new THREE.BoxGeometry(13.5,0.22,2.1),M.wing,0,-0.2,-0.5);
  part(new THREE.BoxGeometry(2.4,0.32,2.5),M.red,-3.8,1.91,-0.5);
  part(new THREE.BoxGeometry(2.4,0.32,2.5),M.red,3.8,1.91,-0.5);
  part(new THREE.BoxGeometry(1.2,0.30,2.5),M.white,-7.2,1.91,-0.5);
  part(new THREE.BoxGeometry(1.2,0.30,2.5),M.white,7.2,1.91,-0.5);
  const strutGeo=new THREE.BoxGeometry(0.24,2.1,0.24);
  for (const sx of[-3.0,3.0]) for (const sz of[0.3,1.8]) part(strutGeo,M.metal,sx,0.85,sz);
  part(new THREE.BoxGeometry(7.2,0.22,1.7),M.wing,0,0.22,3.5);
  part(new THREE.BoxGeometry(0.22,2.2,1.8),M.wing,0,1.2,3.4);
  part(new THREE.BoxGeometry(0.18,1.6,0.8),M.red,0,1.0,4.2);
  part(new THREE.BoxGeometry(1.35,1.0,1.7),M.glass,0,1.2,0.15);
  part(new THREE.SphereGeometry(0.45,6,5),M.dark,0,1.95,0.3);
  part(new THREE.BoxGeometry(0.7,0.6,0.5),M.dark,0,1.55,0.3);
  part(new THREE.TorusGeometry(0.88,0.18,8,12),M.metal,0,0,-4.25,Math.PI/2);
  const propGroup=new THREE.Group(); propGroup.position.z=-6.0;
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.7,8),M.metal);
  hub.rotation.x=Math.PI/2; propGroup.add(hub);
  const bladeGeo=new THREE.BoxGeometry(0.32,4.2,0.14);
  const b1=new THREE.Mesh(bladeGeo,M.dark), b2=b1.clone(); b2.rotation.z=Math.PI/2;
  const tipGeo=new THREE.BoxGeometry(0.5,0.9,0.14);
  const t1=new THREE.Mesh(tipGeo,M.red); t1.position.y=2.2;
  const t2=t1.clone(); t2.position.y=-2.2;
  const t3=new THREE.Mesh(tipGeo,M.red); t3.position.x=2.2;
  const t4=t3.clone(); t4.position.x=-2.2;
  b1.add(t1,t2); b2.add(t3,t4); propGroup.add(b1,b2); root.add(propGroup);
  root.userData.propeller=propGroup;
  const wheelGeo=new THREE.TorusGeometry(0.58,0.21,6,10);
  for (const wx of[-1.7,1.7]) {
    part(new THREE.BoxGeometry(0.18,1.5,0.18),M.metal,wx,-1.55,-1.9);
    part(new THREE.BoxGeometry(3.4,0.18,0.18),M.metal,0,-2.3,-1.9);
    const wheel=new THREE.Mesh(wheelGeo,M.dark);
    wheel.position.set(wx,-2.4,-1.9); wheel.rotation.y=Math.PI/2; root.add(wheel);
  }
  return root;
}
const biplane=buildBiplane();
biplane.position.set(0,300,-500);
scene.add(biplane);

// ── Input ──────────────────────────────────────────────────────────────────────
let rawGamma=0, rawBeta=0, pitchNeutral=65;
let touchDir=0, smoothTurn=0, smoothPitch=0, motionReady=false;
function onOrientation(evt){rawGamma=evt.gamma??0;rawBeta=evt.beta??pitchNeutral;}
const cvs=renderer.domElement;
function getTouchDir(cx){return cx<window.innerWidth*0.5?-1:1;}
const leftEl=document.getElementById('touch-left'), rightEl=document.getElementById('touch-right');
function showTF(dir){leftEl.classList.toggle('active',dir===-1);rightEl.classList.toggle('active',dir===1);}
cvs.addEventListener('touchstart',e=>{touchDir=getTouchDir(e.touches[0].clientX);showTF(touchDir);},{passive:true});
cvs.addEventListener('touchmove', e=>{touchDir=getTouchDir(e.touches[0].clientX);showTF(touchDir);},{passive:true});
cvs.addEventListener('touchend',  ()=>{touchDir=0;showTF(0);},{passive:true});
cvs.addEventListener('mousedown', e=>{touchDir=getTouchDir(e.clientX);showTF(touchDir);});
cvs.addEventListener('mouseup',   ()=>{touchDir=0;showTF(0);});
cvs.addEventListener('mouseleave',()=>{touchDir=0;showTF(0);});

document.getElementById('startBtn').addEventListener('click', async()=>{
  if (typeof DeviceOrientationEvent!=='undefined' &&
      typeof DeviceOrientationEvent.requestPermission==='function') {
    try {
      const perm=await DeviceOrientationEvent.requestPermission();
      if (perm==='granted'){window.addEventListener('deviceorientation',onOrientation,true);motionReady=true;}
    } catch(e){}
  } else {
    window.addEventListener('deviceorientation',onOrientation,true);
    motionReady=true;
  }
  document.getElementById('overlay').style.display='none';
  if (rawBeta!==0) pitchNeutral=rawBeta;
  gameStarted=true; clock.start();
});

// ── Region HUD ────────────────────────────────────────────────────────────────
const regionEl=document.getElementById('region-label');
function updateRegion(x,z){
  const inPark=x>PARK_W1&&x<PARK_W2&&z>PARK_S&&z<PARK_N;
  if (inPark){
    if (z>440&&z<890&&x>-190&&x<190) regionEl.textContent='Flying over the Reservoir';
    else if (z<-1000) regionEl.textContent='Central Park South';
    else if (z>1000)  regionEl.textContent='Central Park North';
    else              regionEl.textContent='Flying over Central Park';
  } else if (x<PARK_W1){
    if (z<-1800)      regionEl.textContent='Columbus Circle';
    else if (z<-800)  regionEl.textContent='Upper West Side';
    else              regionEl.textContent='Upper West Side · Harlem';
  } else if (x>PARK_W2){
    if (z<-1800)      regionEl.textContent='Midtown East · 5th Ave';
    else if (z<-800)  regionEl.textContent='Upper East Side';
    else              regionEl.textContent='Upper East Side · East Harlem';
  } else if (z<PARK_S){
    regionEl.textContent='Midtown Manhattan';
  } else {
    regionEl.textContent='Harlem';
  }
}

// ── Game Loop ──────────────────────────────────────────────────────────────────
let gameStarted=false, yaw=Math.PI, bobTime=0, totalTime=0;
const clock=new THREE.Clock(false);
const camPos=new THREE.Vector3(), camLook=new THREE.Vector3();

{
  const ix=biplane.position.x+Math.sin(yaw)*CFG.camDist;
  const iz=biplane.position.z+Math.cos(yaw)*CFG.camDist;
  camPos.set(ix,biplane.position.y+CFG.camHeight,iz);
  camLook.copy(biplane.position);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

function animate(){
  requestAnimationFrame(animate);

  if (!gameStarted){
    const t=Date.now()*0.00018;
    camera.position.set(biplane.position.x+Math.sin(t)*40,biplane.position.y+18,biplane.position.z+Math.cos(t)*40);
    camera.lookAt(biplane.position);
    biplane.userData.propeller.rotation.z+=0.04;
    waterUniforms.forEach(u=>{u.time.value+=0.016;});
    renderer.render(scene,camera); return;
  }

  const dt=Math.min(clock.getDelta(),0.05);
  totalTime+=dt;

  // Input
  let rawInput=0;
  if (motionReady&&Math.abs(rawGamma)>1.5){
    rawInput=Math.max(-1,Math.min(1,rawGamma/CFG.tiltClamp));
  } else {rawInput=touchDir;}
  const targetTurn=rawInput*CFG.turnGain;
  smoothTurn+=(targetTurn-smoothTurn)*CFG.inputSmooth;
  yaw-=smoothTurn*dt;

  const fwdX=-Math.sin(yaw), fwdZ=-Math.cos(yaw);
  biplane.position.x+=fwdX*CFG.planeSpeed*dt;
  biplane.position.z+=fwdZ*CFG.planeSpeed*dt;

  bobTime+=dt;
  let rawPitchInput=0;
  if (motionReady) rawPitchInput=Math.max(-1,Math.min(1,(rawBeta-pitchNeutral)/CFG.pitchClamp));
  smoothPitch+=(rawPitchInput-smoothPitch)*CFG.pitchSmooth;
  biplane.position.y+=smoothPitch*CFG.pitchGain*dt;

  const gH=getHeight(biplane.position.x,biplane.position.z);
  const floorY=gH+40;
  if (biplane.position.y<floorY) biplane.position.y+=(floorY-biplane.position.y)*0.12;
  if (!motionReady||Math.abs(rawPitchInput)<0.12){
    biplane.position.y+=(gH+CFG.targetAlt-biplane.position.y)*CFG.altSmooth;
  }

  const half=CFG.worldSize*0.48;
  if (biplane.position.x> half) biplane.position.x-=CFG.worldSize*0.96;
  if (biplane.position.x<-half) biplane.position.x+=CFG.worldSize*0.96;
  if (biplane.position.z> half) biplane.position.z-=CFG.worldSize*0.96;
  if (biplane.position.z<-half) biplane.position.z+=CFG.worldSize*0.96;

  biplane.rotation.y=yaw;
  biplane.rotation.z+=((-smoothTurn*CFG.bankMult)-biplane.rotation.z)*CFG.bankSmooth;
  biplane.rotation.x=-smoothPitch*0.5+Math.sin(bobTime*0.55)*0.018;
  biplane.userData.propeller.rotation.z+=dt*(20+Math.abs(smoothTurn)*2);

  // Camera
  camPos.lerp(new THREE.Vector3(
    biplane.position.x+Math.sin(yaw)*CFG.camDist,
    biplane.position.y+CFG.camHeight,
    biplane.position.z+Math.cos(yaw)*CFG.camDist
  ), CFG.cameraSmooth);
  camera.position.copy(camPos);
  camLook.lerp(new THREE.Vector3(
    biplane.position.x+fwdX*18, biplane.position.y-1, biplane.position.z+fwdZ*18
  ), CFG.lookSmooth);
  camera.lookAt(camLook);

  // Animate water
  waterUniforms.forEach(u=>{u.time.value=totalTime;});

  // Drift clouds
  cloudList.forEach(c=>{
    c.position.x+=c.userData.spd*dt;
    if (c.position.x>CFG.worldSize*0.5) c.position.x-=CFG.worldSize;
    if (c.position.x<-CFG.worldSize*0.5) c.position.x+=CFG.worldSize;
  });

  // Move boats
  boatList.forEach(b=>{
    b.position.z+=b.userData.spd*dt;
    if (b.position.z>3100) b.position.z=-3100;
    if (b.position.z<-3100) b.position.z=3100;
  });

  updateRegion(biplane.position.x, biplane.position.z);
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

animate();
</script>
